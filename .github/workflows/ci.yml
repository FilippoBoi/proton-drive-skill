name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install rclone (also exercises the installer)
        run: python skills/proton-drive/scripts/install_rclone.py
        continue-on-error: true
      - name: Compile
        run: python -m compileall -q skills/proton-drive/scripts
      - name: Tests
        run: python -m unittest discover -s tests -v
